<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101118">
    <title>Paper Reader</title>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <span class="brand"><span class="brand-icon" aria-hidden="true">P<span class="brand-dot">.</span></span> Paper Reader</span>

      </div>
      <main>
        <section aria-label="Paper library">
          <div class="library-heading">
            <h1>Library</h1>
            <div class="filters" role="group" aria-label="Filter by reading status">
              <button id="unread" type="button" aria-pressed="true">Unread</button>
              <button id="read" type="button" aria-pressed="false">Read</button>
            </div>
          </div>
          <p id="status" class="hint" role="status"></p>
          <button id="retry" type="button" hidden>Retry loading</button>
          <ul id="papers"></ul>
        </section>
        <dialog id="add-dialog" aria-labelledby="add-heading">
          <div class="dialog-heading">
            <h2 id="add-heading">Add paper</h2>
            <button id="close-dialog" type="button" aria-label="Close">×</button>
          </div>
          <form id="add-paper">
            <label for="paper-url">Paper link</label>
            <input id="paper-url" name="url" type="url" maxlength="2048" required placeholder="https://…" aria-describedby="add-status" autofocus>
            <label id="title-field" hidden>Paper title <input id="paper-title" name="title" maxlength="300" disabled></label>
            <p id="add-status" class="hint" role="status"></p>
            <button class="primary" type="submit">Find title</button>
          </form>
        </dialog>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
